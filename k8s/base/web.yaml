apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipit-web
  namespace: shipit
  labels:
    app.kubernetes.io/name: shipit-web
    app.kubernetes.io/part-of: shipit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shipit-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipit-web
        app.kubernetes.io/part-of: shipit
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          # NOTE: tag is rewritten to :<sha> by CI on every main push.
          image: ghcr.io/samir-khadka/shipit-web:a2cc4ab33094170855072586f5641949ecd61bf1
          imagePullPolicy: Always
          ports:
            - name: http
              # nginx-unprivileged listens on 8080, not 80.
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shipit-web
  namespace: shipit
  labels:
    app.kubernetes.io/name: shipit-web
    app.kubernetes.io/part-of: shipit
spec:
  selector:
    app.kubernetes.io/name: shipit-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
