apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipit-api
  namespace: shipit
  labels:
    app.kubernetes.io/name: shipit-api
    app.kubernetes.io/part-of: shipit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shipit-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipit-api
        app.kubernetes.io/part-of: shipit
    spec:
      containers:
        - name: api
          # NOTE: tag is rewritten to :<sha> by CI on every main push.
          # imagePullPolicy: Always keeps the mutable tag honest.
          image: ghcr.io/samir-khadka/shipit-api:7f44952e2820bda1ccc9fe659e22581869885226
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: v1.0.0
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shipit-api
  namespace: shipit
  labels:
    app.kubernetes.io/name: shipit-api
    app.kubernetes.io/part-of: shipit
spec:
  selector:
    app.kubernetes.io/name: shipit-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
