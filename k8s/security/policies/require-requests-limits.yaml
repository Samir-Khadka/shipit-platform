# Every container must declare CPU/memory requests and limits. Requests let the
# scheduler place pods sanely; limits keep one workload from starving the
# node — both matter on a small free-tier cluster.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require CPU and Memory Requests and Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-requests-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      # Phase 3 carve-out: the Linkerd/Flagger upstream charts do not set
      # cpu/memory requests+limits on all of their own control-plane
      # components, and forking their pod specs just to satisfy a workload
      # policy would couple us to chart internals. Their versions are still
      # pinned in k8s/apps/*.yaml. The policy stays Enforce for everything
      # else — including every shipit workload and every injected
      # linkerd-proxy sidecar (whose resources ARE set via the
      # linkerd-control-plane app's proxy.resources values).
      #
      # Phase 4 carve-out (monitoring): same deal for the observability
      # charts (kube-prometheus-stack, loki-stack, tempo). Most chart-internal
      # components — admission-hook Jobs, the grafana test Pod, promtail's
      # DaemonSet (its chart doesn't template resources at all),
      # node-exporter, kube-state-metrics, the operator, grafana's sidecars —
      # don't take resources via values. The components that matter for node
      # safety (prometheus, alertmanager, grafana, loki, tempo) DO get
      # requests+limits via k8s/observability/*-values.yaml. Chart versions
      # are pinned in k8s/apps/*.yaml.
      exclude:
        any:
          - resources:
              namespaces:
                - linkerd
                - linkerd-viz
                - flagger
                - monitoring
      validate:
        message: "CPU and memory requests and limits are required for every container."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
