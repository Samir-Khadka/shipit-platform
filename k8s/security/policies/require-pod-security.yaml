# Baseline pod security: no privileged containers, no running as root.
# All shipit images are built non-root (api: appuser, worker: node,
# web: nginx-unprivileged) and the Deployments set runAsNonRoot, so the
# workloads comply with this policy by construction.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-pod-security
  annotations:
    policies.kyverno.io/title: Require Pod Security Basics
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: disallow-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      # Phase 3 carve-out (same rationale as require-requests-limits): the
      # upstream Linkerd/Flagger charts manage their own pod security
      # contexts; we pin their versions in k8s/apps/*.yaml instead of
      # rewriting their specs. Still Enforce for all shipit workloads.
      #
      # Phase 4 carve-out (monitoring): promtail's DaemonSet must read
      # /var/log on the host, so it runs as root by design — there is no
      # non-root way to tail host container logs. Everything else the
      # observability charts install already runs non-root (verified by
      # rendering the pinned charts), but the namespace-wide carve-out keeps
      # us decoupled from chart internals, same as Phase 3.
      #
      # Phase 5 carve-out (chaos-mesh): chaos-daemon MUST run privileged with
      # hostPID — it injects faults through the kernel (tc/iptables for
      # network chaos, process signals for pod-kill). There is no unprivileged
      # way to do this; the tool is privileged by design, its version is
      # pinned (chart 2.8.7), and every experiment is still scoped to the
      # shipit namespace by the selector in k8s/chaos/*.yaml.
      exclude:
        any:
          - resources:
              namespaces:
                - linkerd
                - linkerd-viz
                - flagger
                - monitoring
                - chaos-mesh
      validate:
        message: "Privileged containers are not allowed."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[].securityContext.privileged }}"
                operator: AnyIn
                value:
                  - true
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      # Phase 3 carve-out: see disallow-privileged above.
      # Phase 4 carve-out (monitoring): promtail runs as root by design
      # (host log access) — see disallow-privileged above.
      # Phase 5 carve-out (chaos-mesh): chaos-daemon runs as root by design
      # (kernel fault injection) — see disallow-privileged above.
      exclude:
        any:
          - resources:
              namespaces:
                - linkerd
                - linkerd-viz
                - flagger
                - monitoring
                - chaos-mesh
      validate:
        message: "Running as root is not allowed — set spec.securityContext.runAsNonRoot to true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
