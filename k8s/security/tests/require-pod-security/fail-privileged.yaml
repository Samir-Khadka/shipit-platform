apiVersion: apps/v1
kind: Deployment
metadata:
  name: fail-privileged
  namespace: shipit
spec:
  selector:
    matchLabels:
      app: failpriv
  template:
    metadata:
      labels:
        app: failpriv
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/samir-khadka/shipit-api:065f2a4b5b6595026368c89348b2635ff72cc717
          securityContext:
            privileged: true
