apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-pod-security
policies:
  - ../../policies/require-pod-security.yaml
resources:
  - pass-deployment.yaml
  - fail-privileged.yaml
  - fail-root.yaml
  - monitoring-promtail.yaml
  - chaos-mesh-daemon.yaml
results:
  - policy: require-pod-security
    rule: disallow-privileged
    resources:
      - pass-deploy
    kind: Deployment
    result: pass
  - policy: require-pod-security
    rule: require-run-as-non-root
    resources:
      - pass-deploy
    kind: Deployment
    result: pass
  - policy: require-pod-security
    rule: disallow-privileged
    resources:
      - fail-privileged
    kind: Deployment
    result: fail
  - policy: require-pod-security
    rule: require-run-as-non-root
    resources:
      - fail-root
    kind: Deployment
    result: fail
  # Phase 4 carve-out: promtail must run as root (host log access) in the
  # excluded monitoring namespace — both rules let it through.
  - policy: require-pod-security
    rule: disallow-privileged
    resources:
      - monitoring-promtail
    kind: Deployment
    result: pass
  - policy: require-pod-security
    rule: require-run-as-non-root
    resources:
      - monitoring-promtail
    kind: Deployment
    result: pass
  # Phase 5 carve-out: chaos-daemon is privileged + root BY DESIGN (kernel
  # fault injection) in the excluded chaos-mesh namespace — both rules let
  # it through. Privileged shipit workloads elsewhere are still rejected.
  - policy: require-pod-security
    rule: disallow-privileged
    resources:
      - chaos-daemon
    kind: DaemonSet
    result: pass
  - policy: require-pod-security
    rule: require-run-as-non-root
    resources:
      - chaos-daemon
    kind: DaemonSet
    result: pass
