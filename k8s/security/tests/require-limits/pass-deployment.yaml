apiVersion: apps/v1
kind: Deployment
metadata:
  name: pass-deploy
  namespace: shipit
spec:
  selector:
    matchLabels:
      app: pass
  template:
    metadata:
      labels:
        app: pass
    spec:
      containers:
        - name: api
          image: ghcr.io/samir-khadka/shipit-api:065f2a4b5b6595026368c89348b2635ff72cc717
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
