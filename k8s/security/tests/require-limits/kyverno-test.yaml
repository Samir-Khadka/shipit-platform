apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-requests-limits
policies:
  - ../../policies/require-requests-limits.yaml
resources:
  - pass-deployment.yaml
  - fail-deployment.yaml
  - excluded-namespace-deployment.yaml
  - monitoring-namespace-deployment.yaml
  - chaos-mesh-namespace-daemonset.yaml
results:
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - pass-deploy
    kind: Deployment
    result: pass
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - fail-deploy
    kind: Deployment
    result: fail
  # Phase 3 carve-out: upstream infra namespaces are excluded on purpose.
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - infra-deploy
    kind: Deployment
    result: pass
  # Phase 4 carve-out: same for the monitoring namespace.
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - monitoring-deploy
    kind: Deployment
    result: pass
  # Phase 5 carve-out: chaos-daemon sets no resources via chart defaults,
  # in the excluded chaos-mesh namespace — let through on purpose.
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - chaos-daemon
    kind: DaemonSet
    result: pass
