apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-requests-limits
policies:
  - ../../policies/require-requests-limits.yaml
resources:
  - pass-deployment.yaml
  - fail-deployment.yaml
results:
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - pass-deploy
    kind: Deployment
    result: pass
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - fail-deploy
    kind: Deployment
    result: fail
