# Messaging API (onboarded external service) — Phase: service onboarding.
#
# Syncs k8s/services/messaging. The messaging-api Deployment is
# Flagger-canaried (see k8s/canary/canary-messaging-api.yaml), so ArgoCD
# must not fight Flagger over the canary's replicas or the apex Service
# selector. Requires the messaging-api-secrets Secret (see
# docs/onboarding-messaging.md) — the app will not start without it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: messaging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shipit
spec:
  project: default
  source:
    repoURL: https://github.com/Samir-Khadka/shipit-platform.git
    targetRevision: main
    path: k8s/services/messaging
  destination:
    server: https://kubernetes.default.svc
    namespace: shipit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: messaging-api
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      name: messaging-api
      jsonPointers:
        - /spec/selector
