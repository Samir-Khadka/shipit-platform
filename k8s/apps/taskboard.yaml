# TaskBoard (onboarded external service) — Phase: service onboarding.
#
# Syncs k8s/services/taskboard (api + web Deployments/Services).
# The taskboard-api Deployment is Flagger-canaried (see k8s/canary/
# canary-taskboard-api.yaml), so — like shipit-api — ArgoCD must not fight
# Flagger over the canary's replicas or the apex Service selector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shipit
spec:
  project: default
  source:
    repoURL: https://github.com/Samir-Khadka/shipit-platform.git
    targetRevision: main
    path: k8s/services/taskboard
  destination:
    server: https://kubernetes.default.svc
    namespace: shipit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: taskboard-api
      jsonPointers:
        - /spec/replicas
    - group: ""
      kind: Service
      name: taskboard-api
      jsonPointers:
        - /spec/selector
