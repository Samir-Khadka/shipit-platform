# kube-prometheus-stack — metrics, alerting, Grafana. Pinned: chart 92.17.1
# (prometheus-community). Values live in k8s/observability/, referenced via
# the multi-source $values pattern (ArgoCD ≥2.x).
#
# COEXISTENCE: this Prometheus is ADDITIVE. Flagger still queries
# http://prometheus.linkerd-viz:9090 (Phase 3) — linkerd-viz is untouched.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shipit
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.17.1
      helm:
        valueFiles:
          - $values/k8s/observability/kube-prometheus-values.yaml
    - repoURL: https://github.com/Samir-Khadka/shipit-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
