# Kyverno itself, GitOps-managed: pinned Helm chart, installed by ArgoCD.
# The policies live in k8s/security/policies and are synced by the
# kyverno-policies app (sync-wave 2, after the CRDs exist).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: shipit
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.9.2 # -> Kyverno v1.19.2
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
