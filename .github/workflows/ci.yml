name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r apps/api/requirements.txt pytest httpx
      - name: Run API tests
        run: python -m pytest apps/api/tests -q

  build:
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push shipit-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}
      - name: Tag :latest on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/samir-khadka/shipit-${{ matrix.service }}:latest \
            ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}
