name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-api:
    # [ci] tag-bump commits are mechanical: skip rebuild to avoid a loop.
    if: "!contains(github.event.head_commit.message, '[ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt pytest httpx
      - name: Run API tests
        run: python -m pytest tests -q

  build:
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push shipit-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}
      - name: Tag :latest on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/samir-khadka/shipit-${{ matrix.service }}:latest \
            ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}

  bump-tags:
    # Closes the GitOps loop: after images land in GHCR, write the new
    # :<sha> tags back into k8s/base so ArgoCD syncs them automatically.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tags to the new sha
        run: |
          SHA="${{ github.sha }}"
          for svc in api worker web; do
            sed -i -E "s#(image: ghcr.io/samir-khadka/shipit-${svc}:)[^[:space:]]+#\1${SHA}#" k8s/base/${svc}.yaml
          done
          git diff --stat -- k8s/base/
      - name: Commit and push tag bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/base/
          git diff --cached --quiet || git commit -m "[ci] bump image tags to ${{ github.sha }}"
          git push
