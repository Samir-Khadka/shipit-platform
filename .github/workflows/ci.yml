name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-api:
    # [ci] tag-bump commits are mechanical: skip rebuild to avoid a loop.
    if: "!contains(github.event.head_commit.message, '[ci]')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt pytest httpx
      - name: Run API tests
        run: python -m pytest tests -q

  build:
    needs: test-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing via GitHub OIDC
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build shipit-${{ matrix.service }} (scan before push)
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          load: true
          push: false
          tags: ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}
      - name: Scan image with Trivy
        # Gate: fail on HIGH/CRITICAL vulnerabilities that have a fix
        # available. ignore-unfixed keeps the gate actionable — it blocks
        # on what we can fix, not on unfixable base-image noise.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push image to GHCR
        run: docker push ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}
      - name: Tag :latest on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/samir-khadka/shipit-${{ matrix.service }}:latest \
            ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.4.3
      - name: Sign image (keyless, GitHub OIDC)
        # Keyless: no private keys anywhere — the signature is bound to the
        # image digest and the CI workflow identity, verified against the
        # public Sigstore infrastructure (Fulcio + Rekor). Digest-bound, so
        # the later [ci] tag-bump commit (k8s YAML only) stays valid.
        # cosign v2.4.3: writes signatures as `.sig` tags (legacy scheme).
        # cosign v3 defaults to the OCI 1.1 referrers API, which Kyverno
        # v1.19.2 cannot look up — v2 keeps signer and verifier in agreement.
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes ghcr.io/samir-khadka/shipit-${{ matrix.service }}:${{ github.sha }}

  bump-tags:
    # Closes the GitOps loop: after images land in GHCR, write the new
    # :<sha> tags back into k8s/base so ArgoCD syncs them automatically.
    # Race-safe: works from the latest origin/main, yields when a newer
    # run owns the bump, and retries the push on contention.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump image tags to the new sha
        run: |
          set -e
          SHA="${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            HEAD_NOW="$(git rev-parse origin/main)"
            if [ "${HEAD_NOW}" != "${SHA}" ]; then
              echo "main has moved on to ${HEAD_NOW}; a newer run owns the tag bump — skipping"
              exit 0
            fi
            git reset --hard origin/main
            for svc in api worker web; do
              sed -i -E "s#(image: ghcr.io/samir-khadka/shipit-${svc}:)[^[:space:]]+#\1${SHA}#" k8s/base/${svc}.yaml
            done
            git add k8s/base/
            if git diff --cached --quiet; then
              echo "image tags already at ${SHA}; nothing to do"
              exit 0
            fi
            git commit -m "[ci] bump image tags to ${SHA}"
            if git push origin main; then
              echo "tag bump pushed"
              exit 0
            fi
            echo "push raced (attempt ${attempt}/3), retrying..."
            sleep 10
          done
          echo "failed to push tag bump after 3 attempts" >&2
          exit 1
